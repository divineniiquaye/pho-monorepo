name: Release

on:
    push:
        paths: ["scripts/init.mjs"]
    pull_request:
        types: [opened, synchronize]
    workflow_dispatch:
        inputs:
            version:
                description: Profile to release (latest/next/canary/release)
                type: choice
                required: false
                options: [latest, next, canary, release]

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        # The operating system it will run on
        runs-on: macos-latest
        # The list of steps that the action will go through
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare repository
              run: git fetch --unshallow --tags

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Install Auto Plugins
              run: npm i -g @auto-it/exec @auto-it/first-time-contributor @auto-it/conventional-commits

            - name: Create Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                git reset --hard && npm i -g auto
                auto ${{ github.event.inputs.version || github.event_name == 'pull_request' && 'canary' || 'shipit' }}
